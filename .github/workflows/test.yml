name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx fastapi uvicorn watchfiles websockets pytest
      - run: pytest tests/ -v -m "not slow"

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject history from before the 2026-10-10 rewrite
        run: |
          if git merge-base --is-ancestor bb7693d42f0e55a5421f000da5545dda600e6fde HEAD 2>/dev/null; then
            echo "This branch holds commits from before the history rewrite. Rebuild it from the current main." >&2
            exit 1
          fi
      - name: Reject history from before the 2026-10-20 rewrite
        run: |
          if git merge-base --is-ancestor ab80b7bec5430917d6f708f4aa3a7ec4e2532745 HEAD 2>/dev/null; then
            echo "This branch holds commits from before the 2026-10-20 history rewrite. Rebuild it from the current main." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx fastapi uvicorn watchfiles websockets pytest
      - run: python3 scripts/mutation_check.py
      - run: ./scripts/harness_check.sh
