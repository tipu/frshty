[project]
name = "frshty"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "jsonschema",
    "fastapi",
    "uvicorn",
    "watchfiles>=1.1.1",
    "mcp",
    "playwright",
    "websockets",
]

[tool.pytest.ini_options]
tmp_path_retention_policy = "failed"
markers = [
    "slow: heavy end-to-end test that needs a multi-core machine; CI runs with -m 'not slow'",
]
