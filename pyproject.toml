[project]
name = "frshty"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn",
    "watchfiles>=1.1.1",
    "mcp",
    "playwright",
]

[tool.pytest.ini_options]
markers = [
    "slow: heavy end-to-end test that needs a multi-core machine; CI runs with -m 'not slow'",
]
