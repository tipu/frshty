[job]
key = "myproject"
platform = "github"               # "github" or "bitbucket"
ticket_system = "linear"          # "jira" or "linear"
port = 7100

# --- GitHub (used when platform = "github") ---
[github]
repo = "org/repo-name"

# --- Bitbucket (used when platform = "bitbucket") ---
# [bitbucket]
# org = "myorg"
# user_env = "BB_USER"            # env var name containing bitbucket username
# token_env = "BB_TOKEN"          # env var name containing bitbucket app password
# user_account_id = ""            # your bitbucket account ID (for filtering your PRs)

# --- Jira (used when ticket_system = "jira") ---
# Use direct values (user/token) or env var names (user_env/token_env)
# [jira]
# base_url = "https://myorg.atlassian.net"
# user = "you@company.com"            # direct value, OR
# user_env = "JIRA_USER"              # env var name
# token = "your-api-token"            # direct value, OR
# token_env = "JIRA_TOKEN"            # env var name
# jql = 'project = X AND assignee = currentUser() AND status IN ("In Progress")'

# --- Linear (used when ticket_system = "linear") ---
[linear]
token_env = "LINEAR_TOKEN"        # env var name, or use token = "lin_api_..." directly
assignee_email = "you@company.com"

[workspace]
root = "/path/to/project"
repos = ["repo-name"]             # explicit repo list, OR use projects_dir to scan
# Repos whose tests require CI-only services/secrets and cannot run locally.
# They remain subject to the platform's required PR checks.
# test_exclude = ["integration-only-repo"]
# projects_dir = "projects"       # scan this subdir for git repos (mutually exclusive with repos)
# exclude = ["some-repo"]         # skip these when scanning projects_dir
tickets_dir = "tickets"
ticket_layout = "flat"            # "flat": tickets/{KEY}/{repo}/ or "workspace": tickets/{KEY}/workspace/{repo}/
base_branch = "main"
branch_prefix = ""                # empty = branch is {KEY}-{slug}. set to "yourname" for yourname/feature/{KEY}-{slug}
# dep_commands = [
#     {match = "some-repo", cmd = "pipenv install --dev"},
# ]
# run_commands = ["cd django-app && pipenv run python manage.py runserver &", "cd frontend && npm start &"]

[pr]
auto_pr = true
auto_merge = false
# merge_strategy = "squash"       # squash, merge, rebase
# merge_flags = ["--admin"]       # extra flags for gh pr merge

[features]
review_prs = false
auto_review = true                # default true. when false, frshty never starts a code review on its own. the PRs waiting on this user are still listed on /reviews and /today, and a review runs only when the operator starts one there. the rest of review_prs (own-PR comments, CI fixes, the peer-review list) is unaffected.
tickets = true
slack = false
timesheet = false
billing = false
releases = false                  # tag tickets to a release; whole-release LLM inspection when all members reach merged/validation/done. optional release.md at <workspace.root>/releases/<release_key>/release.md guides the inspection prompt.
scope_review = false              # consensus scope review (claude/codex/agy) of the branch diff when a ticket is code complete; re-runs whenever branch code changes; a fail verdict holds PR creation and auto-merge until fixed.
pr_autofix = false                # github only: every newly created PR gets a claude+codex review; critical/high findings are consolidated and resolved directly on the PR branch (commit + push). Open PRs that predate enablement are baselined and left alone.

# [slack]
# messages_dir = "/path/to/slack_int/messages/myworkspace"
#                                     # the directory holding this instance's slack capture.
#                                     # frshty reads filtered.jsonl from it, the low noise log
#                                     # slack_int distils from messages.jsonl, and falls back
#                                     # to messages.jsonl when there is no filtered log yet.
#                                     # Rotated siblings of either are read too. raw_path names
#                                     # the raw file alone; set either one and frshty derives
#                                     # the other.
# raw_path = "/path/to/slack_int/messages/myworkspace/messages.jsonl"
# workspace = "myworkspace"           # must match the capture directory name: a filtered
#                                     # record names the workspace it came from and frshty
#                                     # reads only the ones that match.
# user_id = "UXXXXXXX"                # your own slack id. It decides who is asking whom: a
#                                     # request you wrote is you asking somebody else, and it
#                                     # never becomes a task. Set it: the filtered log drops
#                                     # the boot payloads frshty used to discover it from, so
#                                     # without it no mention and no direct message is seen.
# propose_tasks = false               # when true, frshty reads the conversations this user is
#                                     # part of and opens a task on /tasks for the ones where
#                                     # somebody else asks this user for concrete work. Every
#                                     # such task lands in the `proposed` group and never runs
#                                     # until you approve it.
# propose_settle_minutes = 10         # a conversation is judged only once its last message is
#                                     # this old, so a thread still being typed is left alone
# propose_max_age_hours = 48          # never propose from a conversation older than this
# propose_max_per_day = 3             # ceiling on proposals opened for this instance per day
# propose_max_judgements_per_scan = 3 # ceiling on model calls per scan
# propose_judge_retry_minutes = 60    # a conversation the model answered nothing for is
#                                     # held back this long, so it cannot spend the
#                                     # allowance every scan and starve the ones behind it

# [timesheet]
# recurring = [
#     {ticket = "PROJ-1", days = ["mon", "wed"], time = "30m", label = "standup"},
# ]

# --- Billing (requires bill.com env vars) ---
# [billing]
# name = "Acme, Inc."
# rate = 90
# billing_freq = "weekly"             # "weekly" or "monthly"
# billcom_customer_id = "0cu0..."
# invoice_prefix = "INV"
# include_daily_descriptions = false  # when true, pull per-day summaries from jira worklogs
# extras = { ai_tool = 20 }           # flat-fee line items added to every invoice

# --- Events (per-config triggers on lifecycle events) ---
# [events]
# [[events.triggers]]
# on = "ticket_dev_complete"          # fires when ticket passes tri-review
# action = "schedule_pr"              # delay PR creation based on estimation
# jitter_hours = 3                    # +/- random hours
# work_hours = [9, 17]               # clamp to business hours

# --- Approval gate ---
# [ticket_approval]
# required = true                     # tickets land in pending_approval before new
# sources = ["prd"]                   # optional; default = all sources

# --- PM agent ---
# [pm_agent]
# enabled = true                      # default; set false to disable advisory PM reviews
# post_shipping_cadence = "weekly"

# --- Post-merge validator ---
# [validation]
# live_url = "https://staging.example.com"   # base URL for playwright steps
# persistent_browser_context = false         # phase 5: opt-in regression-replay optimization

# --- PRD intake ---
# [prd]
# enabled = true
# file = "/abs/path/to/myapp-prd.md"

# --- LLM provider ---
# [llm]
# provider = "claude"                 # "claude" (default) or "opencode"
#
# Claude provider config (used when provider = "claude"):
# [llm.claude]
# bin = "claude"                      # executable name or absolute path
# config_dir = "~/.aimyable-claude"   # sets CLAUDE_CONFIG_DIR for this instance
#                                     # a work board task that selects this project
#                                     # also runs its agent with this environment
# args = ["--dangerously-skip-permissions"]  # optional extra args prepended to every Claude invocation
# [llm.claude.env]
# SOME_OTHER_VAR = "value"
#
# OpenCode provider config (used when provider = "opencode"):
# [llm.opencode]
# model_thinking = "deepseek/deepseek-v4-pro"     # used by thinking tier (opencode run --model ...)
# model_balanced = "deepseek/deepseek-v4-flash"   # used by balanced tier
# model_fast = "deepseek/deepseek-v4-flash"       # used by fast tier

# --- Peer PR reviewer ---
# [reviewer]
# model = "claude-opus-4-8"            # model for the review personas
# providers = ["claude", "codex"]      # every persona runs once per provider
# max_changed_lines = 8000             # a ticket whose PR diffs add up to more changed
#                                      # lines than this is not reviewed automatically.
#                                      # The event feed says it was skipped. Rerun by hand
#                                      # from the reviews page to review it anyway.
#                                      # Set 0 to remove the cap.

# --- Manager (proactive daily digest) ---
# [manager]
# enabled = true
# cadence = "daily_9_local"            # daily_<hour>_local; supports any hour 0-23
# priorities_file = ""                 # default: <workspace.root>/PRIORITIES.md, then <first repo>/PRIORITIES.md (lowercase fallback also works)
# [manager.thresholds]
# stale_pr_hours = 24                  # own PR with no review >Nh = stale
# stale_ticket_hours = 72              # ticket discovered >Nh ago, status=new/planning/reviewing
# regression_days = 7                  # validation_run regression in last N days
# pending_approval_hours = 12          # pending_approval ticket sitting >Nh
# [manager.watchdog]
# enabled = true                       # staleness buckets open their own doctor task
# scan_interval_minutes = 30           # how often the scan runs; the cron tick is faster
# max_opens_per_scan = 2               # tasks one scan may open
# max_opens_per_day = 6                # tasks 24 hours may open for this instance

# [today_agent]
# enabled = true                       # off unless set; seeds the today_agent_tick schedule
# cadence = "daily_8_local"            # daily_<hour>_local; supports any hour 0-23
# use_llm = true                       # false ranks the staleness buckets deterministically

# --- Wizard (one-card PR-unblock surface) ---
# Maps github logins to Slack targets so /wizard can draft and send pings.
# slack_int's HTTP bridge (127.0.0.1:8900) does the actual sending.
# [slack_targets.octocat]
# workspace = "tipucorp"
# slack_user_id = "U01ABC"
# dm_channel_id = "D01XYZ"
