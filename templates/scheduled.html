<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<title>Scheduled — frshty</title>
<script src="/static/tailwind.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/frshty-nav.js"></script>
<script src="/static/frshty-shell.js"></script>
<link rel="stylesheet" href="/static/frshty.css">
<link rel="stylesheet" href="/static/frshty-v2.css">
<style>
.badge-scheduled { background: #713f12; color: #fde047; }
.badge-ci { background: #1e3a5f; color: #93c5fd; }
.badge-virtual { background: #4b3a1a; color: #fcd34d; }
</style>
</head>
<body>

<div id="app" v-cloak>
<frshty-shell :features="features" :instance="instanceName" width="wide">




<div v-if="!items.length" class="text-gray-500 text-sm">Nothing pending.</div>
<div v-else class="grid gap-3 max-w-2xl">
    <template v-for="item in items">
        <div v-if="item.type === 'scheduled_pr'" :key="`pr-${item.key}`" class="card p-4">
            <div class="flex items-center gap-2 mb-1">
                <span class="badge badge-scheduled">pr scheduled</span>
                <a :href="`/tickets/${item.key}`" class="link font-bold text-sm">{{ item.key }}</a>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-400 mt-1">
                <span>fires {{ fmtDate(item.run_at) }}</span>
                <span class="text-yellow-400">({{ relTime(item.run_at) }})</span>
                <input type="time" v-model="timeDrafts[item.key]"
                       class="bg-gray-900 border border-gray-700 rounded px-1 py-0.5 text-xs text-gray-300" />
                <button @click="reschedule(item.key)"
                        class="bg-blue-800 hover:bg-blue-700 text-blue-200 px-2 py-0.5 rounded text-xs">Save</button>
            </div>
            <div v-if="item.meta && item.meta.branch" class="text-xs text-gray-500 mt-1">{{ item.meta.branch }}</div>
        </div>
        <div v-else-if="item.type === 'recurring_virtual'" :key="`virt-${item.ticket}-${item.time}`"
             class="card p-4" title="Derived from config (read-only). Edit the TOML and restart to change.">
            <div class="flex items-center gap-2 mb-1">
                <span class="badge badge-virtual">from config 🔒</span>
                <span class="font-bold text-sm">{{ item.ticket }} · {{ item.time }}</span>
                <span v-if="item.label" class="text-xs text-gray-500">{{ item.label }}</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-400 mt-1">
                <span>fires {{ fmtDate(item.run_at) }}</span>
                <span class="text-yellow-400">({{ relTime(item.run_at) }})</span>
            </div>
        </div>
        <div v-else-if="item.type === 'recurring'" :key="`rec-${item.task}-${item.run_at}`" class="card p-4">
            <div class="flex items-center gap-2 mb-1">
                <span class="badge badge-recurring">{{ cadenceLabel(item.cadence) }}</span>
                <span class="font-bold text-sm">{{ item.task }}</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-400 mt-1">
                <span>fires {{ fmtDate(item.run_at) }}</span>
                <span class="text-yellow-400">({{ relTime(item.run_at) }})</span>
            </div>
            <div class="text-xs text-gray-500 mt-1">
                <template v-if="item.last_run_at">Last fired {{ fmtDate(item.last_run_at) }} ({{ relTime(item.last_run_at) }})</template>
                <template v-else>Never fired</template>
            </div>
        </div>
        <div v-else-if="item.type === 'ci_pending'" :key="`ci-${item.key}`" class="card p-4">
            <div class="flex items-center gap-2 mb-1">
                <span class="badge badge-ci">ci pending</span>
                <a :href="`/tickets/${item.key}`" class="link font-bold text-sm">{{ item.key }}</a>
                <span v-if="(item.prs || []).length" class="text-xs">
                    <a v-for="p in item.prs" :key="p.url" :href="p.url" class="link" target="_blank">#{{ p.id }}</a>
                </span>
            </div>
            <div class="text-xs text-gray-400">
                <template v-if="item.checks_started_at">checks running {{ relTime(item.checks_started_at) }}</template>
                <template v-else>waiting for checks</template>
            </div>
            <div v-if="item.branch" class="text-xs text-gray-500 mt-1">{{ item.branch }}</div>
        </div>
    </template>
</div>


</frshty-shell>
</div>

<script>
const { createApp, ref, reactive, watch, onMounted } = Vue;

const CADENCE_LABELS = { weekly: 'Weekly', monthly: 'Monthly', daily_19pst: 'Daily 7pm PT' };

frshtyApp({
    setup() {
        const items = ref([]);
        const features = ref({});
        const instanceName = ref('');
        const timeDrafts = reactive({});

        function relTime(iso) {
            const d = new Date(iso);
            const diff = d - Date.now();
            const abs = Math.abs(diff);
            const mins = Math.floor(abs / 60000);
            const hrs = Math.floor(mins / 60);
            const remMins = mins % 60;
            const label = hrs > 0 ? `${hrs}h ${remMins}m` : `${mins}m`;
            return diff > 0 ? `in ${label}` : `${label} ago`;
        }
        function fmtDate(iso) {
            return new Date(iso).toLocaleDateString('en-US', {
                weekday: 'short', month: 'short', day: 'numeric',
                hour: 'numeric', minute: '2-digit',
            });
        }
        function cadenceLabel(c) { return CADENCE_LABELS[c] || c; }

        async function load() {
            try {
                const [r1, r2] = await Promise.all([fetch('/api/scheduled'), fetch('/api/config')]);
                items.value = await r1.json();
                const cfg = await r2.json();
                features.value = cfg.features || {};
                instanceName.value = cfg.job?.key || '';
                for (const item of items.value) {
                    if (item.type === 'scheduled_pr') {
                        if (timeDrafts[item.key] === undefined) {
                            const d = new Date(item.run_at);
                            timeDrafts[item.key] = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                        }
                    }
                }
            } catch (e) { console.error('scheduled load failed', e); }
        }

        async function reschedule(key) {
            const t = timeDrafts[key];
            if (!t) return;
            const [h, m] = t.split(':').map(Number);
            const d = new Date();
            d.setHours(h, m, 0, 0);
            const r = await fetch(`/api/scheduled/${key}/reschedule`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({run_at: d.toISOString()}),
            });
            if (r.ok) load();
        }

        onMounted(() => {
            load();
            setInterval(load, 10000);
        });

        return {
            items, features, instanceName, timeDrafts,
            relTime, fmtDate, cadenceLabel,
            reschedule,
        };
    },
}).mount('#app');
</script>
</body>
</html>
