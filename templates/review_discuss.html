<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<title>Discuss — frshty</title>
<script src="/static/tailwind.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/vendor/xterm.js"></script>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<script src="/static/vendor/xterm-addon-fit.js"></script>
<script src="/static/vendor/xterm-addon-web-links.js"></script>
<style>
body { font-family: 'SF Mono', 'Cascadia Code', monospace; background: #0a0a0a; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
.badge-blocking { background: #991b1b; color: #fca5a5; }
.badge-suggestion { background: #713f12; color: #fde047; }
.badge-question { background: #1e3a5f; color: #93c5fd; }
#terminal-container .xterm { height: 100%; }
[v-cloak] { display: none; }
</style>
</head>
<body>

<div id="app" v-cloak class="flex flex-col h-screen">
    <div class="flex items-center gap-3 px-4 py-2 bg-gray-900 border-b border-gray-800 flex-shrink-0">
        <span class="font-bold text-blue-400 text-sm">{{ repo }} PR #{{ prId }}</span>
        <span v-if="file" class="text-xs text-gray-400">{{ file }}{{ line ? ':' + line : '' }}</span>
        <span v-if="severity" class="badge" :class="`badge-${severity}`">{{ severity }}</span>
        <button @click="resetDiscuss" class="ml-auto bg-red-900 hover:bg-red-800 text-red-300 px-3 py-1 rounded text-xs">Reset</button>
    </div>
    <div v-if="contextBody" class="px-4 py-2 bg-gray-900/50 border-b border-gray-800 text-xs text-gray-400 flex-shrink-0">{{ contextBody }}</div>
    <div ref="terminalContainer" id="terminal-container" class="flex-1"></div>
</div>

<script>
const { createApp, ref, onMounted, onUnmounted } = Vue;

createApp({
    setup() {
        const params = new URLSearchParams(window.location.search);
        const repo = params.get('repo') || '';
        const prId = params.get('pr_id') || '';
        const idx = params.get('idx') || 'general';
        const file = params.get('file') || '';
        const line = params.get('line') || '';
        const severity = params.get('severity') || '';

        const stored = JSON.parse(sessionStorage.getItem(`discuss-${repo}-${prId}-${idx}`) || '{}');
        const contextBody = ref(idx !== 'general' && stored.body ? stored.body : '');

        const terminalContainer = ref(null);
        let ws = null;
        let term = null;
        let fitAddon = null;
        let sessionId = null;
        let resizeObserver = null;

        async function startDiscuss() {
            const resp = await fetch(`/api/reviews/${repo}/${prId}/discuss`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({idx, file, line, severity, body: stored.body || ''}),
            });
            const data = await resp.json();
            sessionId = data.session_id;
            setTimeout(connectTerminal, 500);
        }

        function connectTerminal() {
            const container = terminalContainer.value;
            if (!container) return;
            term = new Terminal({
                cursorBlink: true, fontSize: 14,
                fontFamily: "'JetBrains Mono','Fira Code','Cascadia Code',Menlo,monospace",
                theme: { background: '#0a0a0f', foreground: '#e2e8f0', cursor: '#e2e8f0', selectionBackground: '#334155' },
            });
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(new WebLinksAddon.WebLinksAddon());
            term.open(container);
            fitAddon.fit();
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/discuss/${sessionId}`);
            ws.binaryType = 'arraybuffer';
            ws.onopen = () => {
                fitAddon.fit();
                ws.send(JSON.stringify({type: 'resize', cols: term.cols, rows: term.rows}));
            };
            ws.onmessage = (event) => {
                const data = event.data instanceof ArrayBuffer ? new Uint8Array(event.data) : event.data;
                term.write(data);
            };
            ws.onclose = () => { if (term) term.write('\r\n\x1b[90m[disconnected]\x1b[0m\r\n'); };
            term.onData((data) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(data); });
            resizeObserver = new ResizeObserver(() => {
                if (fitAddon) fitAddon.fit();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({type: 'resize', cols: term.cols, rows: term.rows}));
                }
            });
            resizeObserver.observe(container);
        }

        async function resetDiscuss() {
            if (sessionId) await fetch(`/api/tickets/${sessionId}/terminal`, {method: 'DELETE'});
            if (ws) try { ws.close(); } catch (e) {}
            if (term) try { term.dispose(); } catch (e) {}
            term = null;
            if (terminalContainer.value) terminalContainer.value.innerHTML = '';
            startDiscuss();
        }

        onMounted(startDiscuss);
        onUnmounted(() => {
            if (resizeObserver) try { resizeObserver.disconnect(); } catch (e) {}
            if (ws) try { ws.close(); } catch (e) {}
            if (term) try { term.dispose(); } catch (e) {}
        });

        return { repo, prId, idx, file, line, severity, contextBody, terminalContainer, resetDiscuss };
    },
}).mount('#app');
</script>
</body>
</html>
