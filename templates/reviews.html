<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<title>Reviews — frshty</title>
<script src="/static/tailwind.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
body { font-family: 'SF Mono', 'Cascadia Code', monospace; background: #0a0a0a; color: #e0e0e0; }
.card { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; }
.link { color: #60a5fa; }
.link:hover { text-decoration: underline; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
.badge-red { background: #991b1b; color: #fca5a5; }
.badge-green { background: #14532d; color: #86efac; }
.badge-yellow { background: #713f12; color: #fde047; }
.badge-purple { background: #3b1e5f; color: #d8b4fe; }
nav a { color: #888; padding: 4px 12px; border-radius: 4px; }
nav a:hover, nav a.active { color: #fff; background: #222; }
.pulse { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
[v-cloak] { display: none; }
</style>
</head>
<body class="p-4 max-w-7xl mx-auto">

<div id="app" v-cloak>

<header class="flex items-center gap-4 mb-4">
    <div class="flex items-center gap-2">
        <h1 class="text-lg font-bold">Reviews</h1>
        <span class="text-xs font-mono bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-700">{{ instanceName }}</span>
    </div>
    <nav class="flex gap-1 text-sm">
        <a href="/">Feed</a>
        <a href="/global">Global</a>
        <a href="/reviews" class="active">Reviews</a>
        <a href="/tickets">Tickets</a>
        <a href="/scheduled">Scheduled</a>
        <a href="/slack">Slack</a>
        <a v-if="features.timesheet !== false" href="/timesheet">Timesheet</a>
        <a v-if="features.billing !== false" href="/billing">Billing</a>
        <a href="/config">Config</a>
    </nav>
</header>

<div class="card p-3 mb-4 flex gap-2 items-center">
    <input type="text" v-model="prUrl" @keydown.enter="submitReview" placeholder="paste PR url to review"
           class="flex-1 bg-transparent border border-gray-700 rounded px-3 py-1.5 text-sm text-gray-200 focus:border-blue-500 focus:outline-none" />
    <button @click="submitReview" :disabled="submitting"
            class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-1.5 rounded cursor-pointer whitespace-nowrap">
        {{ submitButtonLabel }}
    </button>
</div>

<div class="space-y-3 mb-4">
    <div v-for="p in pendingList" :key="p.full_repo + '/' + p.pr_id" class="card p-4 border-l-4 border-l-blue-500">
        <div class="flex items-start justify-between">
            <div>
                <span class="font-semibold text-base text-blue-400">{{ p.full_repo }}#{{ p.pr_id }}</span>
                <span class="badge badge-yellow ml-2 mt-2 inline-block">reviewing <span class="pulse">●</span></span>
            </div>
            <a :href="p.url" target="_blank" class="link text-xs whitespace-nowrap hover:underline">[open →]</a>
        </div>
    </div>
</div>

<div class="space-y-3">
    <div v-if="!reviews.length" class="text-gray-600">No reviews queued.</div>
    <template v-else>
        <div v-for="(group, ticket) in groups" :key="ticket" class="mb-4">
            <div class="text-sm text-gray-400 mb-1">
                {{ ticket }} — {{ group.label }}
                <span v-if="group.authors.length" class="text-gray-500">by {{ group.authors.join(', ') }}</span>
            </div>
            <div class="space-y-1">
                <pr-card v-for="r in group.items" :key="r.repo + '/' + r.pr_id" :r="r" :bb="bbByKey[r.repo + '/' + r.pr_id]"></pr-card>
            </div>
        </div>
        <div v-if="ungrouped.length" class="mb-4">
            <div class="text-sm text-gray-400 mb-1">Other</div>
            <div class="space-y-1">
                <pr-card v-for="r in ungrouped" :key="r.repo + '/' + r.pr_id" :r="r" :bb="bbByKey[r.repo + '/' + r.pr_id]"></pr-card>
            </div>
        </div>
    </template>
</div>

</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

function timeAgo(iso) {
    if (!iso) return '';
    const secs = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (secs < 60) return 'just now';
    const mins = Math.floor(secs / 60);
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
}

function extractTicket(branch) {
    const m = (branch || '').match(/dev-(\d+)/i);
    return m ? `DEV-${m[1]}` : null;
}

function ticketLabel(branch) {
    return (branch || '').replace(/^[A-Za-z]+-dev-\d+-?/i, '').replace(/^dev-\d+-?/i, '').replace(/-/g, ' ').trim() || branch || '';
}

const PrCard = {
    props: ['r', 'bb'],
    setup(props) {
        const reviewing = computed(() => props.r.branch && props.r.branch.startsWith('pending-'));
        const verdictCls = computed(() => {
            if (reviewing.value) return 'badge-yellow';
            if (props.r.verdict === 'changes_requested') return 'badge-red';
            if (props.r.verdict === 'approved') return 'badge-green';
            return 'badge-yellow';
        });
        const stale = computed(() => !reviewing.value && props.r.updated_on && props.r.reviewed_at &&
            new Date(props.r.updated_on) > new Date(props.r.reviewed_at));
        return { reviewing, verdictCls, stale, timeAgo };
    },
    template: `
        <div class="card p-4" :class="{ 'border-l-4 border-l-blue-500': reviewing }">
            <div class="flex items-start justify-between mb-2">
                <div class="flex-1">
                    <a :href="'/reviews/' + r.repo + '/' + r.pr_id" class="link font-semibold text-base hover:text-blue-300">{{ r.repo }}#{{ r.pr_id }}</a>
                    <div class="text-gray-400 text-sm mt-1 line-clamp-2">{{ r.title || '' }}</div>
                </div>
                <a :href="r.pr_url" target="_blank" class="link text-xs ml-3 whitespace-nowrap hover:underline">[open →]</a>
            </div>
            <div class="flex flex-wrap gap-2 items-center mt-3 pt-3 border-t border-gray-800">
                <span class="badge" :class="verdictCls" title="LLM verdict">
                    <template v-if="reviewing">reviewing <span class="pulse">●</span></template>
                    <template v-else-if="r.verdict">llm: {{ r.verdict }}</template>
                    <template v-else>pending</template>
                </span>
                <span v-if="r.approved_by_me" class="badge badge-purple" title="you approved this PR on the platform">✓ you</span>
                <span v-if="r.created_on" class="text-gray-600 text-xs">created {{ timeAgo(r.created_on) }}</span>
                <span v-if="r.updated_on" class="text-gray-600 text-xs">updated {{ timeAgo(r.updated_on) }}</span>
                <span v-if="stale" class="badge badge-yellow text-xs">stale</span>
                <span v-if="bb && bb.count" class="text-gray-400 text-xs ml-auto">💬 {{ bb.count }}<template v-if="bb.initials && bb.initials.length"> · {{ bb.initials.join(', ') }}</template></span>
            </div>
        </div>
    `,
};

createApp({
    components: { 'pr-card': PrCard },
    setup() {
        const reviews = ref([]);
        const features = ref({});
        const instanceName = ref('');
        const prUrl = ref('');
        const submitting = ref(false);
        const submitButtonLabel = ref('review');
        const pending = reactive({});
        const bbByKey = reactive({});

        const groups = computed(() => {
            const out = {};
            for (const r of reviews.value) {
                const t = extractTicket(r.branch);
                if (!t) continue;
                if (!out[t]) out[t] = { label: ticketLabel(r.branch), items: [], authors: new Set() };
                out[t].items.push(r);
                if (r.author) out[t].authors.add(r.author);
            }
            const result = {};
            for (const k of Object.keys(out)) {
                result[k] = { label: out[k].label, items: out[k].items, authors: [...out[k].authors] };
            }
            return result;
        });

        const ungrouped = computed(() => reviews.value.filter(r => !extractTicket(r.branch)));

        const pendingList = computed(() => Object.values(pending));

        async function load() {
            try {
                const [revResp, configResp] = await Promise.all([
                    fetch('/api/reviews'),
                    fetch('/api/config'),
                ]);
                reviews.value = await revResp.json();
                const cfg = await configResp.json();
                features.value = cfg.features || {};
                instanceName.value = cfg.job?.key || '';
                for (const r of reviews.value) {
                    const k = `${r.repo}/${r.pr_id}`;
                    if (pending[k]) delete pending[k];
                }
                loadBBComments();
            } catch (e) { console.error('reviews load failed', e); }
        }

        function loadBBComments() {
            for (const r of reviews.value) {
                if (!r.pr_id) continue;
                fetch(`/api/reviews/${r.repo}/${r.pr_id}/bb-comments`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && typeof data.count === 'number') {
                            bbByKey[`${r.repo}/${r.pr_id}`] = data;
                        }
                    })
                    .catch(() => {});
            }
        }

        async function submitReview() {
            const url = prUrl.value.trim();
            if (!url) return;
            submitting.value = true;
            submitButtonLabel.value = 'submitting...';
            try {
                const resp = await fetch('/api/reviews/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url}),
                });
                const result = await resp.json();
                if (result.status === 'started') {
                    pending[`${result.repo}/${result.pr_id}`] = {
                        repo: result.repo.split('/').pop(),
                        full_repo: result.repo,
                        pr_id: result.pr_id,
                        url,
                    };
                    prUrl.value = '';
                    submitButtonLabel.value = 'review';
                } else {
                    submitButtonLabel.value = result.error || 'failed';
                    setTimeout(() => { submitButtonLabel.value = 'review'; }, 2000);
                }
            } finally {
                submitting.value = false;
            }
        }

        onMounted(() => { load(); });

        return {
            reviews, features, instanceName, prUrl, submitting, submitButtonLabel,
            pendingList, groups, ungrouped, bbByKey,
            submitReview,
        };
    },
}).mount('#app');
</script>
</body>
</html>
