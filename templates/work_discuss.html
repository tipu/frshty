<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discuss — frshty</title>
<script src="/static/vendor/xterm.js"></script>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<script src="/static/vendor/xterm-addon-fit.js"></script>
<script src="/static/frshty-terminal-select.js"></script>
<script src="/static/vendor/xterm-addon-web-links.js"></script>
<style>
html, body { margin: 0; height: 100%; background: #0a0a0f; }
body { display: flex; flex-direction: column; font: 12px/1 system-ui, sans-serif; color: #777; }
#bar { flex: none; box-sizing: border-box; height: 34px; display: flex; align-items: center; gap: 12px;
       padding: 0 14px; background: #0d0d13; border-bottom: 1px solid #2a2a35; }
#bar a { color: #93c5fd; text-decoration: none; white-space: nowrap; }
#bar a:hover { text-decoration: underline; }
#objective { color: #d5d5dc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
#restart { background: #1e1e2e; color: #d5d5dc; border: 1px solid #3a3a48; border-radius: 4px;
           padding: 5px 10px; font: inherit; cursor: pointer; }
#restart:hover { background: #2a2a3c; }
#status { white-space: nowrap; }
#term { flex: 1; min-height: 0; padding: 6px; box-sizing: border-box; }
</style>
<script src="/static/frshty-usage.js"></script>
</head>
<body>
<div id="bar">
  <a id="back" href="/tasks">← tasks</a>
  <span id="objective"></span>
  <button id="restart" type="button">Restart Claude</button>
  <span id="status"></span>
</div>
<div id="term"></div>
<script>
const id = location.pathname.split("/")[2];
const params = new URLSearchParams(location.search);
const peer = params.get("peer") || "";
const apiBase = peer ? "/api/work/peers/" + encodeURIComponent(peer) : "";
const back = document.getElementById("back");
if (params.get("embed")) back.hidden = true;
back.href = "/tasks/" + id + (peer ? "?peer=" + encodeURIComponent(peer) : "");
back.textContent = "← task #" + id;
document.title = "Discuss #" + id + " — frshty";
const statusEl = document.getElementById("status");
const restartBtn = document.getElementById("restart");
let ws = null, delay = 0, retry = null;

fetch(apiBase + "/api/work/items/" + id + "/summary")
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((d) => {
    document.getElementById("objective").textContent = "Discuss #" + id + " · " + (d.item.objective || "");
    document.title = "Discuss #" + id + " — " + (d.item.objective || "");
  })
  .catch((e) => {
    document.getElementById("objective").textContent =
      "could not read task #" + id + ": " + (e.message || String(e));
  });

const term = new Terminal({
  cursorBlink: true, fontSize: 14,
  fontFamily: "'JetBrains Mono', 'Fira Code', Menlo, monospace",
  theme: { background: "#0a0a0f", foreground: "#e2e8f0", cursor: "#e2e8f0", selectionBackground: "#334155" },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.loadAddon(new WebLinksAddon.WebLinksAddon());
term.open(document.getElementById("term"));
frshtyTerminalSelect(term);
fit.fit();
term.onData((d) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(d); });

function sendSize() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
  }
}
new ResizeObserver(() => { fit.fit(); sendSize(); }).observe(document.getElementById("term"));

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const wsPath = peer ? `/ws/peers/${encodeURIComponent(peer)}/terminal/discuss-${id}` : `/ws/terminal/discuss-${id}`;
  ws = new WebSocket(`${proto}//${location.host}${wsPath}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { delay = 0; statusEl.textContent = "connected"; fit.fit(); sendSize(); };
  ws.onmessage = (e) => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data);
  ws.onclose = (e) => {
    if (e.code === 1008) {
      term.write("\r\n\x1b[31m[terminal unavailable]\x1b[0m\r\n");
      statusEl.textContent = "unavailable";
      return;
    }
    delay = Math.min(delay ? delay * 2 : 500, 8000);
    statusEl.textContent = `reconnecting in ${delay}ms…`;
    retry = setTimeout(() => { term.reset(); connect(); }, delay);
  };
}

async function launch(restart) {
  statusEl.textContent = restart ? "restarting claude…" : "starting claude…";
  try {
    const resp = await fetch(`${apiBase}/api/work/items/${id}/discuss/start${restart ? "?restart=true" : ""}`, { method: "POST" });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      statusEl.textContent = "error: " + (body.error || resp.statusText);
      return false;
    }
  } catch (e) {
    statusEl.textContent = "error: " + (e.message || String(e));
    return false;
  }
  return true;
}

restartBtn.addEventListener("click", async () => {
  restartBtn.disabled = true;
  try {
    if (!(await launch(true))) return;
    clearTimeout(retry);
    if (ws) { ws.onclose = null; ws.close(); }
    delay = 0;
    term.reset();
    connect();
    term.focus();
  } finally {
    restartBtn.disabled = false;
  }
});

launch(false).then((ok) => { if (ok) { connect(); term.focus(); } });
</script>
</body>
</html>
