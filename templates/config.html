<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<title>Config — frshty</title>
<script src="/static/tailwind.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/frshty-nav.js"></script>
<script src="/static/frshty-shell.js"></script>
<link rel="stylesheet" href="/static/frshty.css">
<link rel="stylesheet" href="/static/frshty-v2.css">
<style>
.editor { width: 100%; min-height: 600px; background: #0d0d0d; color: #e0e0e0; border: 1px solid #2a2a2a; border-radius: 6px; padding: 12px; font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 13px; line-height: 1.5; resize: vertical; tab-size: 4; }
.editor:focus { outline: none; border-color: #444; }
.btn { background: #1e3a5f; color: #93c5fd; border: none; padding: 4px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn:hover { background: #2a4a6f; }
.btn:disabled { opacity: 0.5; cursor: default; }
.msg { font-size: 12px; padding: 4px 10px; border-radius: 4px; display: inline-block; }
</style>
</head>
<body>

<div id="app" v-cloak>
<frshty-shell :features="features" :instance="instanceName"><div class="ln-page">




<div class="flex items-center gap-3 mb-3">
    <span class="text-xs text-gray-500">{{ configPath }}</span>
    <div class="ml-auto flex items-center gap-2">
        <span v-if="msg" class="msg" :class="msgClass">{{ msg }}</span>
        <button class="btn" :disabled="saving" @click="save">{{ saving ? 'Saving...' : 'Save' }}</button>
    </div>
</div>

<textarea v-model="content" @keydown="onKey" spellcheck="false" class="editor"></textarea>


</div></frshty-shell>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

frshtyApp({
    setup() {
        const content = ref('');
        const configPath = ref('');
        const features = ref({});
        const instanceName = ref('');
        const msg = ref('');
        const msgKind = ref('');
        const saving = ref(false);
        let msgTimer = null;

        const msgClass = computed(() => msgKind.value === 'ok' ? 'msg-ok' : 'msg-err');

        async function load() {
            try {
                const [r1, r2] = await Promise.all([fetch('/api/config/raw'), fetch('/api/config')]);
                const data = await r1.json();
                content.value = data.content;
                configPath.value = data.path;
                const cfg = await r2.json();
                features.value = cfg.features || {};
                instanceName.value = cfg.job?.key || '';
            } catch (e) { console.error('config load failed', e); }
        }

        async function save() {
            saving.value = true;
            try {
                const resp = await fetch('/api/config/raw', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: content.value}),
                });
                const data = await resp.json();
                if (data.ok) {
                    msg.value = 'saved';
                    msgKind.value = 'ok';
                } else {
                    msg.value = data.error || 'failed';
                    msgKind.value = 'err';
                }
            } catch (e) {
                msg.value = e.message;
                msgKind.value = 'err';
            }
            saving.value = false;
            if (msgTimer) clearTimeout(msgTimer);
            msgTimer = setTimeout(() => { msg.value = ''; msgKind.value = ''; }, 3000);
        }

        function onKey(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                save();
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                const el = e.target;
                const start = el.selectionStart;
                content.value = content.value.substring(0, start) + '    ' + content.value.substring(el.selectionEnd);
                Vue.nextTick(() => { el.selectionStart = el.selectionEnd = start + 4; });
            }
        }

        onMounted(load);

        return { content, configPath, features, instanceName, msg, msgClass, saving, save, onKey };
    },
}).mount('#app');
</script>
</body>
</html>
