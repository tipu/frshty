<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation — frshty</title>
<script src="/static/tailwind.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root { --bg: #08090c; --panel: #11131a; --line: #232634; --accent: #60a5fa; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: 'SF Mono', 'Cascadia Code', ui-monospace, monospace; background: var(--bg); color: #e6e8ee; overflow: hidden; }
[v-cloak] { display: none; }

.stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 22px; font-size: 12px; color: #6b7280; flex-shrink: 0; z-index: 20; }
.topbar a { color: #6b7280; text-decoration: none; }
.topbar a:hover { color: #cbd5e1; }
.progress-track { flex: 1; height: 3px; background: #1b1e27; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width .45s cubic-bezier(.4,0,.2,1); }

.viewport { flex: 1; position: relative; min-height: 0; }
.slide { position: absolute; inset: 0; display: flex; justify-content: center; padding: 2vh 6vw 8vh; overflow-y: auto; }
.slide.tall { padding-top: 4vh; }
.slide.tall .slide-inner { margin-top: 0; }
.slide-inner { width: 100%; max-width: 1000px; margin: auto 0; }

.kicker { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; font-weight: 600; }
.headline { font-size: clamp(26px, 4vw, 46px); font-weight: 700; line-height: 1.15; color: #f4f6fb; letter-spacing: -0.01em; }
.lead { font-size: clamp(16px, 1.7vw, 21px); line-height: 1.6; color: #c5cbd6; margin-top: 22px; }
.sub { font-size: 14px; line-height: 1.6; color: #8a91a0; margin-top: 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: #1a1f2e; border: 1px solid #2a3142; color: #93c5fd; font-size: 12px; padding: 4px 11px; border-radius: 999px; text-decoration: none; }
.pill:hover { border-color: var(--accent); }

.step-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.step-num { font-size: 13px; color: #4b5263; flex-shrink: 0; padding-top: 6px; }
.fileloc { font-size: 13px; color: #7c8696; margin-top: 8px; }

.checkbadge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 6px 13px; border-radius: 8px; margin-top: 4px; }
.check-ok { background: rgba(34,150,80,.14); border: 1px solid rgba(52,180,100,.4); color: #7ee2a8; }
.check-concern { background: rgba(200,120,20,.14); border: 1px solid rgba(220,150,40,.45); color: #fcd34d; }

.code-card { margin-top: 22px; background: #0c0e14; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.code-scroll { overflow-x: auto; padding: 14px 0; }
.code-line { display: flex; gap: 14px; line-height: 1.7; padding: 0 18px; font-size: 13.5px; }
.code-num { color: #3a4150; min-width: 42px; text-align: right; user-select: none; flex-shrink: 0; }
.code-body { white-space: pre; }

.verdict-icon { font-size: 52px; line-height: 1; }
.concern-item { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: #d4b483; padding: 9px 0; border-top: 1px solid #1d2130; }

.dots { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 14px; flex-shrink: 0; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 999px; background: #2a3040; cursor: pointer; transition: all .25s; border: none; padding: 0; }
.dot:hover { background: #475069; }
.dot.active { background: var(--accent); width: 22px; }
.dot.concern { background: #b4791f; }
.dot.concern.active { background: #f59e0b; }

.navbtn { position: fixed; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 999px; background: rgba(28,32,44,.7); border: 1px solid #2a3142; color: #9aa3b2; font-size: 18px; cursor: pointer; z-index: 30; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.navbtn:hover { background: #232a3a; color: #fff; }
.navbtn:disabled { opacity: 0; pointer-events: none; }
.navbtn.left { left: 18px; }
.navbtn.right { right: 18px; }

.spinner { width: 30px; height: 30px; border: 3px solid #2a3142; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.fade-enter-active, .fade-leave-active { transition: opacity .32s ease, transform .32s cubic-bezier(.4,0,.2,1); }
.fade-enter-from { opacity: 0; transform: translateY(16px); }
.fade-leave-to { opacity: 0; transform: translateY(-12px); }

.hint { font-size: 11px; color: #4b5263; }

.diff-wrap { margin-top: 22px; }
.diff-file { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; background: #0c0e14; }
.diff-fhead { background: #161a24; padding: 8px 14px; font-size: 12.5px; color: #93c5fd; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.diff-row { display: flex; font-size: 12.5px; line-height: 1.65; }
.diff-gutter { width: 46px; flex-shrink: 0; text-align: right; padding: 0 8px; color: #3a4150; user-select: none; }
.diff-sign { width: 11px; flex-shrink: 0; color: #5a6373; user-select: none; }
.diff-code { white-space: pre-wrap; word-break: break-word; padding-right: 12px; flex: 1; }
.diff-hunkrow { background: #11151f; color: #6b7689; padding: 2px 14px; font-size: 12px; }
.diff-add { background: rgba(56,139,87,.22); }
.diff-del { background: rgba(248,81,73,.18); }
.diff-add .diff-gutter, .diff-add .diff-sign, .diff-del .diff-gutter, .diff-del .diff-sign { color: #aeb8c4; }
.viz-flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 0; margin-top: 30px; }
.viz-node-wrap { display: flex; align-items: center; animation: vizIn .45s cubic-bezier(.4,0,.2,1) both; }
.viz-node { width: 170px; min-height: 118px; border-radius: 14px; border: 1.5px solid; background: #0f121a; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; font-family: inherit; color: inherit; }
button.viz-node { cursor: pointer; transition: transform .2s, background .2s; }
button.viz-node:hover { transform: translateY(-3px); background: #151a26; }
.viz-node-icon { font-size: 22px; line-height: 1; }
.viz-node-label { font-size: 14px; font-weight: 700; color: #f4f6fb; line-height: 1.3; }
.viz-node-note { font-size: 11.5px; color: #8a91a0; line-height: 1.45; word-break: break-word; }
.viz-node-kind { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; margin-top: auto; }
.viz-arrow { width: 34px; text-align: center; color: #3f4759; font-size: 20px; flex-shrink: 0; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; font-size: 11.5px; color: #8a91a0; }
.viz-legend span { display: inline-flex; align-items: center; gap: 6px; }
.viz-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
@keyframes vizIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

.viz-ba { display: grid; grid-template-columns: 1fr 48px 1fr; gap: 0; margin-top: 30px; align-items: stretch; }
.viz-ba-col { border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.viz-ba-before { background: rgba(248,81,73,.08); border: 1px solid rgba(248,81,73,.35); }
.viz-ba-after { background: rgba(52,180,100,.08); border: 1px solid rgba(52,180,100,.4); }
.viz-ba-title { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }
.viz-ba-item { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.5; color: #d6dae3; animation: vizIn .4s both; }
.viz-ba-mid { display: flex; align-items: center; justify-content: center; font-size: 26px; color: #8b5cf6; }

.viz-bars { margin-top: 26px; display: flex; flex-direction: column; gap: 9px; }
.viz-bar-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) 92px; gap: 14px; align-items: center; font-size: 12.5px; animation: vizIn .4s both; }
.viz-bar-name { color: #c5cbd6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.viz-bar-track { height: 14px; background: #151924; border-radius: 4px; overflow: hidden; display: flex; }
.viz-bar-add { background: #2ea05a; height: 100%; }
.viz-bar-del { background: #d0453e; height: 100%; }
.viz-bar-count { color: #8a91a0; text-align: right; white-space: nowrap; }
.viz-mark { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 6px; vertical-align: middle; }

.viz-score { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; margin-top: 30px; }
.viz-donut-label { font-size: 30px; font-weight: 700; fill: #f4f6fb; font-family: inherit; }
.viz-donut-sub { font-size: 10px; fill: #8a91a0; letter-spacing: .14em; font-family: inherit; }
.viz-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; flex: 1; min-width: 260px; }
.viz-tile { background: #0f121a; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.viz-tile-num { font-size: 28px; font-weight: 700; line-height: 1.1; }
.viz-tile-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b7280; margin-top: 6px; }

@media (max-width: 640px) {
    .viz-node { width: 100%; min-height: 0; }
    .viz-node-wrap { width: 100%; flex-direction: column; }
    .viz-arrow { transform: rotate(90deg); width: auto; height: 26px; }
    .viz-ba { grid-template-columns: 1fr; gap: 10px; }
    .viz-ba-mid { transform: rotate(90deg); }
    .viz-bar-row { grid-template-columns: minmax(0, 1fr) 70px; }
    .viz-bar-track { grid-column: 1 / -1; grid-row: 2; }
}
</style>
<script src="/static/frshty-usage.js"></script>
</head>
<body>
<div id="app" v-cloak>
<div class="stage">

    <div class="topbar">
        <a :href="'/reviews/' + repo + '/' + prId">&larr; {{ repo }}#{{ prId }}</a>
        <div class="progress-track"><div class="progress-fill" :style="{ width: progressPct + '%' }"></div></div>
        <span class="hint" v-if="ready">{{ current + 1 }} / {{ slides.length }}</span>
    </div>

    <div class="viewport">
        <div v-if="!ready" class="slide">
            <div class="slide-inner text-center flex flex-col items-center gap-5">
                <div class="spinner"></div>
                <div class="lead" style="margin:0">{{ statusMsg }}</div>
                <div class="hint">Reading the ticket, the diff and the branch to build a flow-ordered walkthrough.</div>
            </div>
        </div>

        <transition v-else name="fade" mode="out-in">
            <div class="slide" :class="{ tall: slide.type === 'fulldiff' }" :key="current">
                <div class="slide-inner">

                    <template v-if="slide.type === 'ticket'">
                        <div class="kicker">The ticket</div>
                        <div class="flex items-center gap-3 mb-5 flex-wrap">
                            <a v-if="slide.ticket_key && slide.ticket_url" :href="slide.ticket_url" target="_blank" class="pill">{{ slide.ticket_key }} &nearr;</a>
                            <span v-else-if="slide.ticket_key" class="pill">{{ slide.ticket_key }}</span>
                            <a v-if="slide.pr_url" :href="slide.pr_url" target="_blank" class="pill">{{ repo }}#{{ prId }} &nearr;</a>
                        </div>
                        <div class="headline">{{ slide.pr_title || ('PR #' + prId) }}</div>
                        <div v-if="slide.pr_description" class="lead" style="white-space: pre-wrap;">{{ slide.pr_description }}</div>
                        <div v-if="slide.summary" class="sub" style="white-space: pre-wrap;">{{ slide.summary }}</div>
                    </template>

                    <template v-else-if="slide.type === 'problem'">
                        <div class="kicker">The problem</div>
                        <div class="headline" style="font-size: clamp(22px,2.8vw,34px); font-weight:600;">{{ slide.problem }}</div>
                        <div v-if="slide.approach" class="lead">
                            <span style="color:#8b5cf6; font-weight:600;">Approach &mdash; </span>{{ slide.approach }}
                        </div>
                    </template>

                    <template v-else-if="slide.type === 'step'">
                        <div class="step-head">
                            <span class="step-num">{{ slide.stepNum }}</span>
                            <div style="flex:1; min-width:0;">
                                <div class="kicker" style="margin-bottom:8px;">Step {{ slide.stepNum }}</div>
                                <div class="headline" style="font-size: clamp(20px,2.4vw,30px);">{{ slide.title }}</div>
                                <div v-if="slide.file" class="fileloc">{{ slide.file }}</div>
                            </div>
                        </div>
                        <div class="lead" style="margin-top:18px;">{{ slide.narrative }}</div>
                        <div v-if="slide.code" class="code-card">
                            <div class="code-scroll">
                                <div v-for="(ln, i) in parseCode(slide.code)" :key="i" class="code-line">
                                    <span class="code-num">{{ ln.num != null ? ln.num : '' }}</span><span class="code-body" v-html="hl(slide, i)"></span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <span class="checkbadge" :class="slide.check === 'concern' ? 'check-concern' : 'check-ok'">
                                <span>{{ slide.check === 'concern' ? '⚠' : '✓' }}</span>
                                <span>{{ slide.check_note || (slide.check === 'concern' ? 'Needs a closer look.' : 'Correct and on-purpose.') }}</span>
                            </span>
                        </div>
                    </template>

                    <template v-else-if="slide.type === 'fulldiff'">
                        <div class="kicker">Full diff</div>
                        <div class="headline" style="font-size: clamp(20px,2.4vw,30px);">Every change, in full</div>
                        <div class="sub">{{ diffStats }} &mdash; scan for anything the walkthrough didn't call out.</div>
                        <div class="diff-wrap">
                            <div v-for="f in parsedDiff" :key="f.header" class="diff-file">
                                <div class="diff-fhead">{{ f.header }}</div>
                                <template v-for="(ln, li) in f.lines" :key="li">
                                    <div v-if="ln.type === 'hunk'" class="diff-hunkrow">{{ ln.text }}</div>
                                    <div v-else class="diff-row" :class="ln.type === 'add' ? 'diff-add' : ln.type === 'del' ? 'diff-del' : ''">
                                        <span class="diff-gutter">{{ ln.newLine != null ? ln.newLine : '' }}</span>
                                        <span class="diff-sign">{{ ln.type === 'add' ? '+' : ln.type === 'del' ? '−' : '' }}</span>
                                        <span class="diff-code" v-html="ln._hl || escHtml(ln.text)"></span>
                                    </div>
                                </template>
                            </div>
                            <div v-if="!parsedDiff.length" class="sub">Diff unavailable.</div>
                        </div>
                    </template>

                    <template v-else-if="slide.type === 'verdict'">
                        <div class="kicker">Verdict</div>
                        <div class="flex items-center gap-4 mb-2">
                            <span class="verdict-icon">{{ slide.solves_problem ? '✅' : '⚠️' }}</span>
                            <div class="headline" style="font-size: clamp(22px,3vw,38px);">
                                {{ slide.solves_problem ? 'Solves the problem' : 'Does not fully solve it' }}
                            </div>
                        </div>
                        <div class="lead">{{ slide.summary }}</div>
                        <div v-if="slide.concerns && slide.concerns.length" class="mt-6">
                            <div class="kicker" style="color:#f59e0b;">Concerns</div>
                            <div v-for="(c, i) in slide.concerns" :key="i" class="concern-item">
                                <span style="color:#f59e0b;">⚠</span><span>{{ c }}</span>
                            </div>
                        </div>
                        <div v-else class="sub" style="color:#7ee2a8;">No errant, destructive, or dead code flagged.</div>
                        <div class="mt-8 flex gap-3">
                            <a :href="'/reviews/' + repo + '/' + prId" class="pill">Open full diff &amp; comments &rarr;</a>
                        </div>
                    </template>

                    <template v-else-if="slide.type === 'flowmap'">
                        <div class="kicker">At a glance</div>
                        <div class="headline" style="font-size: clamp(22px,3vw,38px);">How the change flows</div>
                        <div class="sub">{{ slide.fromSteps ? 'Each box is one walkthrough step, in execution order. Click a box to revisit it.' : 'The change end to end, in plain words.' }}</div>
                        <div class="viz-flow">
                            <div v-for="(n, i) in slide.nodes" :key="i" class="viz-node-wrap" :style="{ animationDelay: (i * 90) + 'ms' }">
                                <component :is="n.stepNum ? 'button' : 'div'" class="viz-node" :style="{ borderColor: kindStyle(n).color }"
                                           :title="n.stepNum ? 'Go to step ' + n.stepNum : ''" @click="n.stepNum && jumpToStep(n.stepNum)">
                                    <span class="viz-node-icon" :style="{ color: kindStyle(n).color }">{{ kindStyle(n).icon }}</span>
                                    <span class="viz-node-label">{{ n.label }}</span>
                                    <span v-if="n.note" class="viz-node-note">{{ n.note }}</span>
                                    <span class="viz-node-kind" :style="{ color: kindStyle(n).color }">{{ kindStyle(n).name }}</span>
                                </component>
                                <span v-if="i < slide.nodes.length - 1" class="viz-arrow">&rarr;</span>
                            </div>
                        </div>
                        <div class="viz-legend">
                            <span v-for="k in slide.legend" :key="k.name"><i class="viz-swatch" :style="{ background: k.color }"></i>{{ k.name }}</span>
                        </div>
                    </template>

                    <template v-else-if="slide.type === 'beforeafter'">
                        <div class="kicker">What changes</div>
                        <div class="headline" style="font-size: clamp(22px,3vw,38px);">Before &rarr; After</div>
                        <div class="viz-ba">
                            <div class="viz-ba-col viz-ba-before">
                                <div class="viz-ba-title" style="color:#f87171;">Before</div>
                                <div v-for="(b, i) in slide.before" :key="i" class="viz-ba-item" :style="{ animationDelay: (i * 90) + 'ms' }">
                                    <span style="color:#f87171;">&times;</span><span>{{ b }}</span>
                                </div>
                            </div>
                            <div class="viz-ba-mid">&rarr;</div>
                            <div class="viz-ba-col viz-ba-after">
                                <div class="viz-ba-title" style="color:#7ee2a8;">After</div>
                                <div v-for="(a, i) in slide.after" :key="i" class="viz-ba-item" :style="{ animationDelay: (300 + i * 90) + 'ms' }">
                                    <span style="color:#7ee2a8;">&check;</span><span>{{ a }}</span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template v-else-if="slide.type === 'changemap'">
                        <div class="kicker">Where it lands</div>
                        <div class="headline" style="font-size: clamp(22px,3vw,38px);">Size of the change, file by file</div>
                        <div class="sub">{{ diffStats }} &mdash; green bars are added lines, red bars are removed lines.</div>
                        <div class="viz-bars">
                            <div v-for="(f, i) in changeMap.files" :key="f.name" class="viz-bar-row" :style="{ animationDelay: (i * 40) + 'ms' }">
                                <span class="viz-bar-name" :title="f.name"><bdi><i class="viz-mark" :style="{ background: f.mark }" :title="f.markTitle"></i>{{ f.name }}</bdi></span>
                                <span class="viz-bar-track">
                                    <span class="viz-bar-add" :style="{ width: (f.adds / changeMap.max * 100) + '%' }"></span>
                                    <span class="viz-bar-del" :style="{ width: (f.dels / changeMap.max * 100) + '%' }"></span>
                                </span>
                                <span class="viz-bar-count"><span style="color:#7ee2a8;">+{{ f.adds }}</span> <span style="color:#f87171;">&minus;{{ f.dels }}</span></span>
                            </div>
                        </div>
                        <div v-if="changeMap.hidden" class="sub">{{ changeMap.hidden }} smaller file{{ changeMap.hidden !== 1 ? 's' : '' }} not shown.</div>
                        <div class="viz-legend">
                            <span><i class="viz-mark" style="background:#34d399;"></i>covered by a step</span>
                            <span><i class="viz-mark" style="background:#f59e0b;"></i>step raised a concern</span>
                            <span><i class="viz-mark" style="background:#3a4150;"></i>not in the walkthrough</span>
                        </div>
                    </template>

                    <template v-else-if="slide.type === 'scorecard'">
                        <div class="kicker">Scorecard</div>
                        <div class="headline" style="font-size: clamp(22px,3vw,38px);">
                            {{ scorecard.solves === false ? '⚠️ Needs work' : scorecard.solves === true ? '✅ Ready to review' : 'The review in numbers' }}
                        </div>
                        <div class="viz-score">
                            <svg width="180" height="180" viewBox="0 0 140 140" role="img" :aria-label="scorecard.ok + ' steps ok, ' + scorecard.concern + ' steps with concerns'">
                                <circle cx="70" cy="70" r="54" fill="none" stroke="#1b1e27" stroke-width="16"/>
                                <circle v-if="scorecard.total" cx="70" cy="70" r="54" fill="none" stroke="#34d399" stroke-width="16"
                                        :stroke-dasharray="scorecard.okArc + ' ' + scorecard.circ" transform="rotate(-90 70 70)"/>
                                <circle v-if="scorecard.concern" cx="70" cy="70" r="54" fill="none" stroke="#f59e0b" stroke-width="16"
                                        :stroke-dasharray="scorecard.concernArc + ' ' + scorecard.circ" :stroke-dashoffset="-scorecard.okArc" transform="rotate(-90 70 70)"/>
                                <text x="70" y="72" text-anchor="middle" class="viz-donut-label">{{ scorecard.ok }}/{{ scorecard.total }}</text>
                                <text x="70" y="92" text-anchor="middle" class="viz-donut-sub">STEPS OK</text>
                            </svg>
                            <div class="viz-tiles">
                                <div class="viz-tile"><div class="viz-tile-num" style="color:#93c5fd;">{{ scorecard.total }}</div><div class="viz-tile-label">Steps</div></div>
                                <div class="viz-tile"><div class="viz-tile-num" style="color:#c4b5fd;">{{ scorecard.files }}</div><div class="viz-tile-label">Files</div></div>
                                <div class="viz-tile"><div class="viz-tile-num" style="color:#7ee2a8;">+{{ scorecard.adds }}</div><div class="viz-tile-label">Lines added</div></div>
                                <div class="viz-tile"><div class="viz-tile-num" style="color:#f87171;">&minus;{{ scorecard.dels }}</div><div class="viz-tile-label">Lines removed</div></div>
                                <div class="viz-tile"><div class="viz-tile-num" :style="{ color: scorecard.concerns ? '#fcd34d' : '#7ee2a8' }">{{ scorecard.concerns }}</div><div class="viz-tile-label">Concerns</div></div>
                            </div>
                        </div>
                    </template>

                </div>
            </div>
        </transition>
    </div>

    <button class="navbtn left" :disabled="current === 0" @click="go(-1)">&larr;</button>
    <button class="navbtn right" :disabled="current >= slides.length - 1" @click="go(1)">&rarr;</button>

    <div class="dots" v-if="ready">
        <button v-for="(s, i) in slides" :key="i" class="dot"
                :class="{ active: i === current, concern: s.type === 'step' && s.check === 'concern' }"
                :title="dotTitle(s)" @click="jump(i)"></button>
    </div>

</div>
</div>

<script>
const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

const EXT_LANG = {py:'python',js:'javascript',ts:'typescript',tsx:'tsx',jsx:'jsx',java:'java',rb:'ruby',go:'go',rs:'rust',c:'c',cpp:'cpp',cs:'csharp',php:'php',css:'css',scss:'scss',html:'html',vue:'xml',json:'json',yml:'yaml',yaml:'yaml',sh:'bash',sql:'sql',md:'markdown'};

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
}

function parseCodeLines(code) {
    return (code || '').split('\n').map(raw => {
        const m = raw.match(/^\s*(\d+):\s?(.*)$/);
        if (m) return { num: parseInt(m[1]), text: m[2] };
        return { num: null, text: raw };
    });
}

createApp({
    setup() {
        const parts = window.location.pathname.split('/');
        const repo = parts[2];
        const prId = parseInt(parts[3]);

        const presentation = ref(null);
        const info = ref({});
        const diffText = ref('');
        const ready = ref(false);
        const statusMsg = ref('Building presentation…');
        const current = ref(0);
        let pollTimer = null;
        let keyHandler = null;

        const slides = computed(() => {
            if (!presentation.value) return [];
            const p = presentation.value;
            const out = [{ type: 'ticket', ticket_key: info.value.ticket_key, ticket_url: info.value.ticket_url,
                           pr_url: info.value.pr_url, pr_title: info.value.pr_title, pr_description: info.value.pr_description,
                           summary: info.value.summary }];
            if (p.problem || p.approach) out.push({ type: 'problem', problem: p.problem || '', approach: p.approach || '' });
            (p.steps || []).forEach((s, i) => out.push({ type: 'step', stepNum: i + 1, ...s }));
            if (diffText.value) out.push({ type: 'fulldiff' });
            if (p.verdict) out.push({ type: 'verdict', ...p.verdict });
            out.push(...visualSlides(p));
            return out;
        });

        function highlightFile(file) {
            const ext = (file.header.split('.').pop() || '').toLowerCase();
            const lang = EXT_LANG[ext];
            const bodies = file.lines.filter(l => l.type !== 'hunk');
            if (!lang) { bodies.forEach(l => l._hl = escHtml(l.text)); return; }
            try {
                const code = bodies.map(l => l.text).join('\n');
                const hl = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value.split('\n');
                bodies.forEach((l, i) => l._hl = hl[i] || escHtml(l.text));
            } catch (e) { bodies.forEach(l => l._hl = escHtml(l.text)); }
        }

        const parsedDiff = computed(() => {
            const files = [];
            let cur = null;
            for (const line of (diffText.value || '').split('\n')) {
                if (line.startsWith('diff --git')) { cur = { header: '', lines: [], _n: 1, seen: false }; files.push(cur); }
                else if (line.startsWith('+++ b/') && cur) { cur.header = line.slice(6); }
                else if (line.startsWith('@@') && cur) {
                    cur.seen = true;
                    cur.lines.push({ type: 'hunk', text: line });
                    const m = line.match(/@@ -\d+(?:,\d+)? \+(\d+)/);
                    cur._n = m ? parseInt(m[1]) : 1;
                }
                else if (cur && cur.seen) {
                    let type = 'ctx', nl = null;
                    if (line.startsWith('+')) { type = 'add'; nl = cur._n++; }
                    else if (line.startsWith('-')) { type = 'del'; }
                    else { nl = cur._n++; }
                    cur.lines.push({ type, text: line.slice(1), newLine: nl });
                }
            }
            files.forEach(highlightFile);
            return files;
        });

        const diffStats = computed(() => {
            let adds = 0, dels = 0;
            for (const f of parsedDiff.value) for (const l of f.lines) {
                if (l.type === 'add') adds++; else if (l.type === 'del') dels++;
            }
            const n = parsedDiff.value.length;
            return `${n} file${n !== 1 ? 's' : ''} · +${adds} −${dels}`;
        });

        const KINDS = {
            input:    { name: 'Input',    icon: '⇢', color: '#60a5fa' },
            process:  { name: 'Process',  icon: '⚙', color: '#a78bfa' },
            decision: { name: 'Decision', icon: '◆', color: '#f59e0b' },
            store:    { name: 'Store',    icon: '▤', color: '#22d3ee' },
            output:   { name: 'Output',   icon: '✓', color: '#34d399' },
        };
        const STEP_OK = { name: 'Step ok', icon: '✓', color: '#34d399' };
        const STEP_CONCERN = { name: 'Concern', icon: '⚠', color: '#f59e0b' };

        function kindStyle(n) {
            if (n.stepNum) return n.check === 'concern' ? STEP_CONCERN : STEP_OK;
            return KINDS[n.kind] || KINDS.process;
        }

        function visualSlides(p) {
            const out = [];
            const v = (p.visual && typeof p.visual === 'object') ? p.visual : {};
            const steps = p.steps || [];
            const flow = Array.isArray(v.flow) ? v.flow.filter(n => n && n.label) : [];
            if (flow.length) {
                const used = [...new Set(flow.map(n => KINDS[n.kind] ? n.kind : 'process'))];
                out.push({ type: 'flowmap', nodes: flow, legend: used.map(k => KINDS[k]) });
            } else if (steps.length) {
                out.push({ type: 'flowmap', fromSteps: true, legend: [STEP_OK, STEP_CONCERN],
                           nodes: steps.map((s, i) => ({ label: s.title || `Step ${i + 1}`, note: s.file || '', stepNum: i + 1, check: s.check })) });
            }
            const before = Array.isArray(v.before) ? v.before.filter(Boolean) : [];
            const after = Array.isArray(v.after) ? v.after.filter(Boolean) : [];
            if (before.length && after.length) out.push({ type: 'beforeafter', before, after });
            if (diffText.value) out.push({ type: 'changemap' });
            out.push({ type: 'scorecard' });
            return out;
        }

        function fileMatches(a, b) {
            if (!a || !b) return false;
            return a === b || a.endsWith('/' + b) || b.endsWith('/' + a);
        }

        const changeMap = computed(() => {
            const steps = (presentation.value && presentation.value.steps) || [];
            const all = parsedDiff.value.map(f => {
                let adds = 0, dels = 0;
                for (const l of f.lines) { if (l.type === 'add') adds++; else if (l.type === 'del') dels++; }
                const hits = steps.filter(s => fileMatches(f.header, s.file));
                const concern = hits.some(s => s.check === 'concern');
                return { name: f.header || '(unnamed)', adds, dels,
                         mark: concern ? '#f59e0b' : hits.length ? '#34d399' : '#3a4150',
                         markTitle: concern ? 'A step raised a concern here' : hits.length ? 'Covered by a step' : 'Not in the walkthrough' };
            }).sort((a, b) => (b.adds + b.dels) - (a.adds + a.dels));
            const files = all.slice(0, 20);
            const max = Math.max(1, ...files.map(f => f.adds + f.dels));
            return { files, max, hidden: all.length - files.length };
        });

        const scorecard = computed(() => {
            const p = presentation.value || {};
            const steps = p.steps || [];
            const concern = steps.filter(s => s.check === 'concern').length;
            const ok = steps.length - concern;
            const circ = 2 * Math.PI * 54;
            let adds = 0, dels = 0;
            for (const f of parsedDiff.value) for (const l of f.lines) {
                if (l.type === 'add') adds++; else if (l.type === 'del') dels++;
            }
            const verdict = p.verdict || {};
            return { total: steps.length, ok, concern, circ,
                     okArc: steps.length ? circ * ok / steps.length : 0,
                     concernArc: steps.length ? circ * concern / steps.length : 0,
                     files: parsedDiff.value.length, adds, dels,
                     concerns: (verdict.concerns || []).length,
                     solves: p.verdict ? !!verdict.solves_problem : null };
        });

        function jumpToStep(n) {
            const i = slides.value.findIndex(s => s.type === 'step' && s.stepNum === n);
            if (i >= 0) current.value = i;
        }

        const slide = computed(() => slides.value[current.value] || {});
        const progressPct = computed(() => slides.value.length ? ((current.value + 1) / slides.value.length) * 100 : 0);

        function langFor(file) { return EXT_LANG[(file || '').split('.').pop().toLowerCase()] || null; }
        function parseCode(code) { return parseCodeLines(code); }

        function hl(s, lineIdx) {
            const lines = parseCodeLines(s.code);
            const lang = langFor(s.file);
            const fallback = escHtml(lines[lineIdx] ? lines[lineIdx].text : '');
            if (!lang) return fallback;
            try {
                const text = lines.map(l => l.text).join('\n');
                const res = hljs.highlight(text, { language: lang, ignoreIllegals: true });
                return res.value.split('\n')[lineIdx] || fallback;
            } catch (e) { return fallback; }
        }

        function dotTitle(s) {
            if (s.type === 'ticket') return 'Ticket';
            if (s.type === 'problem') return 'Problem';
            if (s.type === 'verdict') return 'Verdict';
            if (s.type === 'flowmap') return 'How the change flows';
            if (s.type === 'beforeafter') return 'Before → After';
            if (s.type === 'changemap') return 'Where it lands';
            if (s.type === 'scorecard') return 'Scorecard';
            if (s.type === 'fulldiff') return 'Full diff';
            return `Step ${s.stepNum}: ${s.title || ''}`;
        }

        function go(delta) {
            const n = current.value + delta;
            if (n < 0 || n >= slides.value.length) return;
            current.value = n;
        }
        function jump(i) { if (i >= 0 && i < slides.value.length) current.value = i; }

        async function tick() {
            try {
                const resp = await fetch(`/api/reviews/${repo}/${prId}/presentation`);
                const data = await resp.json();
                if (data.status === 'ok' && data.presentation) {
                    presentation.value = data.presentation;
                    ready.value = true;
                    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
                    return;
                }
                if (data.status === 'missing' || data.status === 'not_found') {
                    await fetch(`/api/reviews/${repo}/${prId}/presentation/preprocess`, { method: 'POST' });
                    statusMsg.value = 'Analyzing the change…';
                } else if (data.status === 'building') {
                    statusMsg.value = 'Analyzing the change…';
                }
            } catch (e) { statusMsg.value = 'Retrying…'; }
        }

        onMounted(async () => {
            try {
                const [r, dr] = await Promise.all([
                    fetch(`/api/reviews/${repo}/${prId}/info`),
                    fetch(`/api/reviews/${repo}/${prId}/diff`),
                ]);
                info.value = await r.json();
                diffText.value = (await dr.json()).diff || '';
            } catch (e) {}
            await tick();
            if (!ready.value) pollTimer = setInterval(tick, 3000);
            keyHandler = (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
                else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
                else if (e.key === 'Home') jump(0);
                else if (e.key === 'End') jump(slides.value.length - 1);
            };
            document.addEventListener('keydown', keyHandler);
        });

        onUnmounted(() => {
            if (pollTimer) clearInterval(pollTimer);
            if (keyHandler) document.removeEventListener('keydown', keyHandler);
        });

        return { repo, prId, ready, statusMsg, current, slides, slide, progressPct,
                 parseCode, hl, dotTitle, go, jump, parsedDiff, diffStats, escHtml,
                 kindStyle, changeMap, scorecard, jumpToStep };
    },
}).mount('#app');
</script>
</body>
</html>
