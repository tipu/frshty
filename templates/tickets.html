<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<title>Tickets — frshty</title>
<script src="/static/tailwind.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/frshty-nav.js"></script>
<link rel="stylesheet" href="/static/frshty.css">
<style>
.col { min-width: 180px; }
</style>
</head>
<body class="p-4 max-w-7xl mx-auto">

<div id="app" v-cloak>

<header class="flex items-center gap-4 mb-4">
    <div class="flex items-center gap-2">
        <h1 class="text-lg font-bold">Tickets</h1>
        <span class="text-xs font-mono bg-gray-800 text-gray-300 px-2 py-1 rounded border border-gray-700">{{ instanceName }}</span>
    </div>
    <frshty-nav :features="features" />
</header>

<div class="flex gap-4 overflow-x-auto pb-4">
    <div v-for="col in visibleColumns" :key="col" class="col flex-1">
        <div class="text-xs font-bold text-gray-500 uppercase mb-2">
            {{ col }}<span v-if="HELP[col]" class="text-gray-600 hover:text-gray-300 cursor-help ml-1" :title="HELP[col]">&#9432;</span>
        </div>
        <div v-for="[key, t] in ticketsForColumn(col)" :key="key"
             class="card p-3 mb-2 hover:border-gray-500 transition-colors relative group">
            <a :href="`/tickets/${key}`" class="block">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-bold text-sm">{{ key }}</span>
                    <span class="badge" :class="`badge-${t.status}`">
                        {{ t.status }}<template v-if="['pr_ready','in_review','pr_failed'].includes(t.status)"> ({{ (t.prs || []).length }}/{{ t.repo_count || 0 }})</template>
                    </span>
                    <span v-if="t.pm_findings_count" class="badge bg-amber-900 text-amber-200" :title="`${t.pm_findings_count} PM finding(s)`">⚑ {{ t.pm_findings_count }}</span>
                    <span v-if="t.validation_badge && t.validation_badge !== 'pending'" class="badge"
                          :class="`badge-val-${t.validation_badge}`" :title="`validation: ${t.validation_badge}`">
                        v: {{ t.validation_badge }}
                    </span>
                    <span v-if="t.obsolete_at" class="badge badge-obsolete" title="obsolete">obsolete</span>
                </div>
                <div class="text-xs text-gray-400 mt-1">{{ t.branch || '' }}</div>
                <div v-if="prAuthors(t).length" class="text-xs text-gray-500 mt-1">by {{ prAuthors(t).join(', ') }}</div>
                <div v-if="t.pr_scheduled_at" class="text-xs text-yellow-400 mt-1">PR scheduled {{ fmtScheduled(t.pr_scheduled_at) }}</div>
                <div v-if="t.external_status" class="text-xs text-gray-500 mt-1">{{ t.external_status }}</div>
            </a>
            <button v-if="t.status === 'pr_ready'" @click="submitPr(key)"
                    class="absolute top-2 right-2 bg-green-700 hover:bg-green-600 text-white text-xs px-2 py-1 rounded">Submit PR</button>
            <div v-if="t.status === 'pending_approval'" class="absolute top-2 right-2 flex gap-1">
                <button @click="approve(key)" class="bg-green-700 hover:bg-green-600 text-white text-xs px-2 py-1 rounded">Approve</button>
                <button @click="reject(key)" class="bg-red-800 hover:bg-red-700 text-white text-xs px-2 py-1 rounded">Reject</button>
            </div>
            <button @click="discard(key)"
                    class="absolute right-2 text-gray-600 hover:text-red-400 text-xs hidden group-hover:block"
                    :class="t.status === 'pr_ready' || t.status === 'pending_approval' ? 'bottom-2' : 'top-2'">discard</button>
        </div>
    </div>
</div>

<pr-submit-modal :open="prModalOpen" :repos="prRepos" :submitting="prSubmitting"
                 @close="closePrModal" @submit="onPrSubmit" />

</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const COLUMNS = ['pending_approval', 'new', 'planning', 'reviewing', 'pr_ready', 'in_review', 'pr_failed', 'merged', 'validation'];
const HELP = {
    pending_approval: 'Awaiting human approve/reject before entering the pipeline (gated by [ticket_approval] config).',
    pr_ready: 'Branch pushed and work finished. Waiting for the scheduler (or auto_pr) to open the PR on the platform.',
    in_review: 'PR open, not all merged. Each cycle: poll CI, resolve conflicts, read review comments, check merge state.',
    pr_failed: 'CI or conflict resolution exhausted retries. Needs manual intervention — restart the ticket to retry.',
    validation: 'Post-merge playwright validation running against the live app. Replays the regression pool too.',
};

frshtyApp({
    setup() {
        const tickets = ref({});
        const features = ref({});
        const instanceName = ref('');
        const prModalOpen = ref(false);
        const prRepos = ref([]);
        const prSubmitting = ref(false);
        const currentTicketKey = ref(null);

        const visibleColumns = computed(() =>
            COLUMNS.filter(col => Object.values(tickets.value).some(t => t.status === col))
        );

        function ticketsForColumn(col) {
            return Object.entries(tickets.value).filter(([_, t]) => t.status === col);
        }

        function prAuthors(t) {
            const authors = (t.prs || []).map(p => p.author).filter(a => a);
            return [...new Set(authors)];
        }

        function fmtScheduled(ts) {
            return new Date(ts).toLocaleDateString('en-US', {
                weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
            });
        }

        async function load() {
            try {
                const [ticketsResp, configResp] = await Promise.all([
                    fetch('/api/tickets/list'),
                    fetch('/api/config'),
                ]);
                tickets.value = await ticketsResp.json();
                const cfg = await configResp.json();
                features.value = cfg.features || {};
                instanceName.value = cfg.job?.key || '';
            } catch (e) { console.error('load failed', e); }
        }

        async function discard(key) {
            if (!confirm(`Discard ${key}? It will be picked up fresh on next poll.`)) return;
            await fetch(`/api/tickets/${key}`, {method: 'DELETE'});
            load();
        }

        async function approve(key) {
            const r = await fetch(`/api/tickets/${key}/approve`, {method: 'POST'});
            if (!r.ok) {
                const e = await r.json().catch(() => ({}));
                alert('Approve failed: ' + (e.error || r.statusText));
            }
            load();
        }

        async function reject(key) {
            if (!confirm(`Reject ${key}?`)) return;
            const r = await fetch(`/api/tickets/${key}/reject`, {method: 'POST'});
            if (!r.ok) {
                const e = await r.json().catch(() => ({}));
                alert('Reject failed: ' + (e.error || r.statusText));
            }
            load();
        }

        async function submitPr(key) {
            currentTicketKey.value = key;
            const r = await fetch(`/api/tickets/${key}/pr-info`);
            if (!r.ok) {
                alert('Failed to load PR info');
                return;
            }
            const data = await r.json();
            prRepos.value = data.repos || [];
            prModalOpen.value = true;
        }

        function closePrModal() {
            prModalOpen.value = false;
            currentTicketKey.value = null;
            prRepos.value = [];
        }

        async function onPrSubmit(payload) {
            if (!currentTicketKey.value || !payload.repos.length) return;
            prSubmitting.value = true;
            try {
                const resp = await fetch(`/api/tickets/${currentTicketKey.value}/submit-pr`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload),
                });
                if (resp.ok) {
                    closePrModal();
                    load();
                } else {
                    const err = await resp.json();
                    alert('Error: ' + (err.error || 'Unknown error'));
                }
            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                prSubmitting.value = false;
            }
        }

        onMounted(() => {
            load();
            setInterval(load, 10000);
        });

        return {
            tickets, features, instanceName, HELP,
            prModalOpen, prRepos, prSubmitting,
            visibleColumns,
            ticketsForColumn, prAuthors, fmtScheduled,
            discard, submitPr, closePrModal, onPrSubmit,
            approve, reject,
        };
    },
}).mount('#app');
</script>
</body>
</html>
