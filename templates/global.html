<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Feed — frshty</title>
<script src="/static/tailwind.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/frshty-nav.js"></script>
<script src="/static/frshty-shell.js"></script>
<link rel="stylesheet" href="/static/frshty.css">
<link rel="stylesheet" href="/static/frshty-v2.css">
<style>
.unread { font-weight: 600; border-left: 3px solid #3b82f6; }
.read { opacity: 0.4; }
.badge-purple { background: #3b1e5f; color: #d8b4fe; }
.badge-instance { background: #1a1a2a; color: #7c8da6; border: 1px solid #2a2a3a; }
.dismiss-btn { cursor: pointer; opacity: 0.3; }
.dismiss-btn:hover { opacity: 1; }
.row-expand { cursor: pointer; color: #555; width: 12px; display: inline-block; text-align: center; }
.row-expand:hover { color: #aaa; }
.summary-full { display: none; white-space: pre-wrap; word-break: break-word; }
.expanded .summary-line { display: none; }
.expanded .summary-full { display: block; }
</style>
</head>
<body>

<div id="app" v-cloak>
<frshty-shell :features="features" :instance="instanceName"><div class="ln-page ln-page-wide">




<div v-if="errorKeys.length" class="card card-red px-3 py-2 mb-3 text-sm">
    <div class="text-red-300">⚠ {{ errorKeys.length }} instance(s) unreachable:
        <span v-for="k in errorKeys" :key="k" class="badge badge-red ml-1">{{ k }}</span>
        — events may be missing
    </div>
</div>

<div class="space-y-0.5 text-xs font-mono">
    <div v-if="!filteredEvents.length" class="text-gray-600 text-xs py-2">Nothing to show.</div>
    <div v-for="e in filteredEvents" :key="e.global_id"
         class="feed-row px-2 py-1 hover:bg-gray-900 rounded flex items-center gap-2"
         :class="[(e.read || dismissed.has(e.global_id)) ? 'read' : 'unread', { expanded: expandedRows.has(e.global_id) }]">
        <span class="text-gray-600 w-14 shrink-0">{{ fmtTime(e.ts) }}</span>
        <span class="badge shrink-0" :style="instanceBadgeStyle(e.instance_key)">{{ e.instance_key || '?' }}</span>
        <span>{{ (e.read || dismissed.has(e.global_id)) ? '○' : '●' }}</span>
        <span v-if="hasMore(e)" class="row-expand shrink-0" @click="toggleExpand(e.global_id)">▸</span>
        <span v-else class="row-expand shrink-0"></span>
        <div class="flex-1 min-w-0">
            <span class="badge" :class="badgeCls(e)">{{ e.event }}</span>
            <span class="summary-line ml-2">{{ firstLine(e) }}</span>
            <span class="ml-2"><a v-for="[k, url] in linkPairs(e)" :key="k" :href="resolveLink(url, e.base_url)" target="_blank" class="link">[→ {{ k }}]</a></span>
            <div class="summary-full mt-1 text-xs text-gray-400">{{ e.summary }}</div>
        </div>
        <span v-if="dismissed.has(e.global_id)" class="text-gray-600 ml-2 text-xs" title="dismissed globally">⌀</span>
        <span v-else class="dismiss-btn ml-2" @click="dismissGlobal(e.global_id)" title="dismiss from global feed (does not affect per-instance)">✓</span>
    </div>
</div>


</div></frshty-shell>
</div>

<script>
const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

const SYSTEM_EVENTS = new Set(['cycle_start', 'cycle_end', 'cycle_sleep']);
const INSTANCE_PALETTE = [
    {bg: '#1e3a5f', fg: '#93c5fd'},
    {bg: '#14532d', fg: '#86efac'},
    {bg: '#713f12', fg: '#fde047'},
    {bg: '#3b1e5f', fg: '#d8b4fe'},
    {bg: '#5f1e3a', fg: '#fbcfe8'},
    {bg: '#1e5f5f', fg: '#5eead4'},
    {bg: '#5f3a1e', fg: '#fdba74'},
    {bg: '#4c1d95', fg: '#c4b5fd'},
];

function isNoiseEvent(e) {
    if (e.meta?.category === 'noise') return true;
    if (e.event === 'job_started') return true;
    if (e.event === 'ticket_ci_fix_skipped') return true;
    if (e.event === 'events_started') return true;
    if (e.event === 'review_validation_dropped') return true;
    if (e.event === 'job_finished') {
        const s = e.summary || '';
        return s.includes('ticket=None') && s.includes('status=ok');
    }
    return false;
}

function instanceColor(key) {
    let h = 0;
    for (let i = 0; i < (key || '').length; i++) h = (h * 31 + key.charCodeAt(i)) | 0;
    return INSTANCE_PALETTE[Math.abs(h) % INSTANCE_PALETTE.length];
}

frshtyApp({
    setup() {
        const events = ref([]);
        const errors = ref({});
        const features = ref({});
        const instanceName = ref('');
        const noiseMode = ref(localStorage.getItem('eventNoiseMode') || 'useful');
        const timeWindow = ref(parseInt(localStorage.getItem('eventTimeWindow') || '8', 10));
        const instanceFilter = ref(localStorage.getItem('globalInstanceFilter') || '');
        const showDismissed = ref(false);
        const expandedRows = reactive(new Set());
        const dismissed = reactive(new Set(JSON.parse(localStorage.getItem('globalDismissedEventKeys') || '[]')));

        const errorKeys = computed(() => Object.keys(errors.value));

        const instanceOptions = computed(() => {
            const seen = new Set();
            for (const e of events.value) if (e.instance_key) seen.add(e.instance_key);
            return [...seen].sort();
        });

        const filteredEvents = computed(() => {
            const local = instanceName.value;
            return events.value
                .filter(e => !SYSTEM_EVENTS.has(e.event))
                .filter(e => !instanceFilter.value || e.instance_key === instanceFilter.value)
                .filter(e => {
                    if (noiseMode.value === 'noise') return true;
                    if (e.instance_key !== local) return true;
                    return !isNoiseEvent(e);
                })
                .filter(e => showDismissed.value || !dismissed.has(e.global_id));
        });

        function fmtTime(iso) {
            try {
                const d = new Date(iso);
                const diff = Date.now() - d.getTime();
                const mins = Math.floor(diff / 60000);
                if (mins < 1) return 'just now';
                if (mins < 60) return `${mins}m`;
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return `${hrs}h`;
                return `${Math.floor(hrs / 24)}d`;
            } catch { return ''; }
        }

        function firstLine(e) { return (e.summary || '').split('\n')[0]; }
        function hasMore(e) { return (e.summary || '').includes('\n'); }
        function linkPairs(e) { return Object.entries(e.links || {}).filter(([, url]) => url); }

        function instanceBadgeStyle(key) {
            const c = instanceColor(key || '');
            return `background:${c.bg};color:${c.fg}`;
        }

        function badgeCls(e) {
            if (e.event.includes('error') || e.event.includes('fail')) return 'badge-red';
            if (e.event.includes('complete') || e.event.includes('pass') || e.event.includes('merged')) return 'badge-green';
            if (e.event.includes('started') || e.event.includes('created')) return 'badge-yellow';
            return 'badge-blue';
        }

        function resolveLink(url, baseUrl) {
            if (!url) return '';
            if (/^https?:\/\//.test(url)) return url;
            if (!baseUrl) return url;
            const b = baseUrl.replace(/\/$/, '');
            const u = url.startsWith('/') ? url : `/${url}`;
            return b + u;
        }

        function toggleExpand(id) {
            if (expandedRows.has(id)) expandedRows.delete(id);
            else expandedRows.add(id);
        }

        function dismissGlobal(gid) {
            dismissed.add(gid);
            localStorage.setItem('globalDismissedEventKeys', JSON.stringify([...dismissed]));
        }

        function clearDismissed() {
            if (!confirm('Clear all dismissed events from the global feed?')) return;
            dismissed.clear();
            localStorage.setItem('globalDismissedEventKeys', '[]');
        }

        async function fetchConfig() {
            try {
                const r = await fetch('/api/config');
                const cfg = await r.json();
                features.value = cfg.features || {};
                instanceName.value = cfg.job?.key || '';
            } catch (e) {}
        }

        async function fetchEvents() {
            try {
                const limit = Math.max(5000, timeWindow.value * 1000);
                const r = await fetch(`/api/global/events?limit=${limit}&since_hours=${timeWindow.value}`);
                const data = await r.json();
                events.value = data.events || [];
                errors.value = data.errors || {};
            } catch (e) {
                errors.value = { _fetch: String(e) };
                events.value = [];
            }
        }

        watch(noiseMode, v => localStorage.setItem('eventNoiseMode', v));
        watch(timeWindow, v => {
            localStorage.setItem('eventTimeWindow', String(v));
            fetchEvents();
        });
        watch(instanceFilter, v => localStorage.setItem('globalInstanceFilter', v || ''));

        onMounted(() => {
            fetchConfig();
            fetchEvents();
            setInterval(fetchEvents, 5000);
        });

        return {
            events, errors, features, instanceName,
            noiseMode, timeWindow, instanceFilter, showDismissed,
            expandedRows, dismissed,
            errorKeys, instanceOptions, filteredEvents,
            fmtTime, firstLine, hasMore, linkPairs,
            instanceBadgeStyle, badgeCls, resolveLink,
            toggleExpand, dismissGlobal, clearDismissed,
        };
    },
}).mount('#app');
</script>
</body>
</html>
