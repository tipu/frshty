<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact — frshty</title>
<script src="/static/vendor/xterm.js"></script>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<script src="/static/vendor/xterm-addon-fit.js"></script>
<script src="/static/frshty-terminal-select.js"></script>
<script src="/static/vendor/xterm-addon-web-links.js"></script>
<style>
html, body { margin: 0; height: 100%; background: #0a0a0f; }
body { display: flex; flex-direction: column; font: 12px/1 system-ui, sans-serif; color: #777; }
.bar { flex: none; box-sizing: border-box; height: 34px; display: flex; align-items: center; gap: 12px;
       padding: 0 14px; background: #0d0d13; }
#top { border-bottom: 1px solid #2a2a35; }
#bottom { border-top: 1px solid #2a2a35; }
.bar a { color: #93c5fd; text-decoration: none; white-space: nowrap; }
.bar a:hover { text-decoration: underline; }
#path { color: #d5d5dc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#main { flex: 1; min-height: 0; display: flex; flex-direction: row; }
#frame { flex: 1; min-width: 0; height: 100%; border: 0; background: #fff; }
#toggle, #restart { background: #1e1e2e; color: #d5d5dc; border: 1px solid #3a3a48; border-radius: 4px;
          padding: 5px 10px; font: inherit; cursor: pointer; }
#toggle:hover, #restart:hover { background: #2a2a3c; }
#fav { background: none; border: 0; color: #777; font-size: 16px; line-height: 1; cursor: pointer; padding: 0; }
#fav.on { color: #facc15; }
#status { white-space: nowrap; }
#panel { flex: none; width: 50%; display: none; padding: 6px; box-sizing: border-box; background: #0a0a0f;
         border-left: 1px solid #2a2a35; }
#panel.open { display: block; }
#term { height: 100%; }
</style>
<script src="/static/frshty-usage.js"></script>
</head>
<body>
<div id="top" class="bar">
  <a id="back" href="/tasks">← tasks</a>
  <a id="raw" target="_blank">open raw</a>
  <button id="fav" type="button" title="add to favorites">☆</button>
  <span id="path"></span>
</div>
<div id="main">
  <iframe id="frame"></iframe>
  <div id="panel"><div id="term"></div></div>
</div>
<div id="bottom" class="bar">
  <button id="toggle" type="button">Ask Claude about this artifact</button>
  <button id="restart" type="button" hidden>Restart Claude</button>
  <span id="status"></span>
</div>
<script>
const id = location.pathname.split("/")[2];
const peer = new URLSearchParams(location.search).get("peer") || "";
const apiBase = peer ? "/api/work/peers/" + encodeURIComponent(peer) : "";
const fileUrl = apiBase + "/api/work/artifact_file/" + id;
document.getElementById("frame").src = fileUrl;
document.getElementById("raw").href = fileUrl;
const baseTitle = document.title;
const statusEl = document.getElementById("status");
const panel = document.getElementById("panel");
const toggle = document.getElementById("toggle");
const restartBtn = document.getElementById("restart");
let term = null, fit = null, ws = null, delay = 0, retry = null;

function sendSize() {
  if (ws && ws.readyState === WebSocket.OPEN && term) {
    ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
  }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const wsPath = peer ? `/ws/peers/${encodeURIComponent(peer)}/terminal/artifact-${id}` : `/ws/terminal/artifact-${id}`;
  ws = new WebSocket(`${proto}//${location.host}${wsPath}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { delay = 0; statusEl.textContent = "connected"; fit.fit(); sendSize(); };
  ws.onmessage = (e) => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data);
  ws.onclose = (e) => {
    if (e.code === 1008) {
      term.write("\r\n\x1b[31m[terminal unavailable]\x1b[0m\r\n");
      statusEl.textContent = "unavailable";
      return;
    }
    delay = Math.min(delay ? delay * 2 : 500, 8000);
    statusEl.textContent = `reconnecting in ${delay}ms…`;
    retry = setTimeout(() => { term.reset(); connect(); }, delay);
  };
}

async function launch(restart) {
  statusEl.textContent = restart ? "restarting claude…" : "starting claude…";
  try {
    const resp = await fetch(`${apiBase}/api/work/artifacts/${id}/claude/start${restart ? "?restart=true" : ""}`, { method: "POST" });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      statusEl.textContent = "error: " + (body.error || resp.statusText);
      return false;
    }
  } catch (e) {
    statusEl.textContent = "error: " + (e.message || String(e));
    return false;
  }
  return true;
}

async function start() {
  if (!(await launch(false))) return false;
  term = new Terminal({
    cursorBlink: true, fontSize: 14,
    fontFamily: "'JetBrains Mono', 'Fira Code', Menlo, monospace",
    theme: { background: "#0a0a0f", foreground: "#e2e8f0", cursor: "#e2e8f0", selectionBackground: "#334155" },
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());
  term.open(document.getElementById("term"));
  frshtyTerminalSelect(term);
  fit.fit();
  term.onData((d) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(d); });
  new ResizeObserver(() => { if (panel.classList.contains("open")) { fit.fit(); sendSize(); } })
    .observe(document.getElementById("term"));
  connect();
  restartBtn.hidden = false;
  return true;
}

restartBtn.addEventListener("click", async () => {
  restartBtn.disabled = true;
  try {
    if (!(await launch(true))) return;
    clearTimeout(retry);
    if (ws) { ws.onclose = null; ws.close(); }
    delay = 0;
    term.reset();
    connect();
    term.focus();
  } finally {
    restartBtn.disabled = false;
  }
});

toggle.addEventListener("click", async () => {
  if (panel.classList.contains("open")) {
    panel.classList.remove("open");
    toggle.textContent = "Ask Claude about this artifact";
    return;
  }
  if (!term && !(await start())) return;
  panel.classList.add("open");
  toggle.textContent = "Hide Claude";
  fit.fit();
  sendSize();
  term.focus();
});

const favBtn = document.getElementById("fav");
let favTitle = "artifact #" + id, favId = "";

function showFavorite(items) {
  const hit = items.find((f) => String(f.artifact_id) === id && (f.peer || "") === peer);
  favId = hit ? hit.id : "";
  favBtn.classList.toggle("on", !!favId);
  favBtn.textContent = favId ? "★" : "☆";
  favBtn.title = favId ? "remove from favorites" : "add to favorites";
}

async function favoriteRequest(url, body) {
  try {
    const r = await fetch(url, body === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
    showFavorite(d.items || []);
  } catch (e) {
    statusEl.textContent = "favorite error: " + (e.message || String(e));
  }
}

favBtn.addEventListener("click", () => favId
  ? favoriteRequest("/api/work/artifact_favorites/" + encodeURIComponent(favId) + "/delete", {})
  : favoriteRequest("/api/work/artifact_favorites", { artifact_id: Number(id), peer, title: favTitle }));
favoriteRequest("/api/work/artifact_favorites");

fetch(apiBase + "/api/work/artifacts/" + id)
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((a) => {
    document.getElementById("path").textContent = a.path + (a.note ? " — " + a.note : "");
    favTitle = "#" + a.work_item_id + " " + a.path.split("/").pop();
    document.title = baseTitle.replace(/Artifact$/, () => "#" + a.work_item_id + " - " + a.path.split("/").pop());
    const back = document.getElementById("back");
    back.href = "/tasks/" + a.work_item_id + (peer ? "?peer=" + encodeURIComponent(peer) : "");
    back.textContent = "← task #" + a.work_item_id;
  })
  .catch((e) => {
    document.title = baseTitle + " #" + id;
    document.getElementById("path").textContent = "could not read artifact #" + id + ": " + (e.message || String(e));
  });
</script>
</body>
</html>
